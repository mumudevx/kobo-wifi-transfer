name: release

# Cutting a release is one step: push a tag.
#
#   git tag -a v0.1.0 -m 'v0.1.0' && git push origin v0.1.0
#
# Updating the Homebrew tap needs a repository secret named HOMEBREW_TAP_TOKEN:
# a fine-grained personal access token with Contents: read and write on
# mumudevx/homebrew-tap. Without it the release is still published and only
# the push to the tap is skipped.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs the tag history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test ./...

      - name: decide whether the tap can be published
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the release will be published but the Homebrew tap will not be updated."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned to the v2 line: `brews` is deprecated there but still supported.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GORELEASER_SKIP_BREW: ${{ steps.tap.outputs.skip }}
